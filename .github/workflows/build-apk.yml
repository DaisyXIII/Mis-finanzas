name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Configurar Node.js (Expo SDK 54 requiere Node >= 20.19)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      # 3. Configurar Java JDK (necesario para Gradle)
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Instalar dependencias del proyecto
      - name: Install dependencies
        run: npm ci

      # 5. Comprobar tipos antes de compilar
      - name: Typecheck
        run: npm run typecheck

      # 6. Generar la carpeta nativa de Android
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # 7. Configurar Gradle (incluye caché de dependencias)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8. Compilar APK de release.
      #    La variante debug NO incluye el JavaScript (necesita Metro en marcha) y en el móvil
      #    se queda en una pantalla de error. La release lleva el bundle dentro y, con la
      #    plantilla de Expo, se firma con la clave de debug, así que se puede instalar directamente.
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # 9. Subir el APK resultante a los Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: mis-finanzas-apk
          path: android/app/build/outputs/apk/release/app-release.apk
